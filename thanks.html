<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Sent | SpokyWorks</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      color:#eefafa;
      background:radial-gradient(circle at 50% 15%,rgba(46,230,200,.12),transparent 30rem),#061317;
    }
    .card{
      width:min(620px,100%);padding:38px;border-radius:24px;text-align:center;
      border:1px solid rgba(46,230,200,.28);background:#0b2228;
      box-shadow:0 20px 60px rgba(0,0,0,.3)
    }
    .check{
      width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
      margin:0 auto 20px;border:2px solid #2ee6c8;color:#2ee6c8;font-size:30px
    }
    h1{margin:0 0 12px}.muted{color:#aec4c7;line-height:1.7}
    a{
      display:inline-flex;margin-top:20px;padding:12px 18px;border-radius:12px;
      background:linear-gradient(90deg,#078f82,#087b86);color:white;text-decoration:none;font-weight:750
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>Message sent</h1>
    <p class="muted">Thank you for contacting SpokyWorks. Your message has been submitted to the developer.</p>
    <a href="https://kbjacksmith.github.io/">Return to SpokyWorks</a>
  </main>
</body>
</html>
